name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  schemas:
    # Every schema validates as Draft 2020-12, and every example validates
    # against its schema. A schema with no example gets read three ways.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "jsonschema[format]>=4.20" pyyaml
      - name: Schemas are valid Draft 2020-12
        run: |
          python - <<'PY'
          import json, pathlib, sys
          from jsonschema import Draft202012Validator
          bad = []
          files = sorted(pathlib.Path("schemas").glob("*.json"))
          if not files:
              sys.exit("no schemas found")
          for p in files:
              try:
                  Draft202012Validator.check_schema(json.loads(p.read_text()))
                  print(f"ok    {p}")
              except Exception as e:
                  bad.append(f"{p}: {e}")
          if bad:
              sys.exit("\n".join(bad))
          print(f"\n{len(files)} schemas valid")
          PY
      - name: Every schema has at least one example, and examples validate
        run: |
          python - <<'PY'
          import json, pathlib, sys
          from jsonschema import Draft202012Validator
          examples = pathlib.Path("schemas/examples")
          missing, invalid = [], []
          for p in sorted(pathlib.Path("schemas").glob("*.json")):
              found = sorted(examples.glob(f"{p.stem}*.json")) if examples.is_dir() else []
              if not found:
                  missing.append(p.name)
                  continue
              validator = Draft202012Validator(json.loads(p.read_text()))
              for ex in found:
                  errors = sorted(validator.iter_errors(json.loads(ex.read_text())), key=str)
                  if errors:
                      invalid.append(f"{ex}: {errors[0].message}")
          if missing:
              print("no example for:", ", ".join(missing))
          if invalid:
              sys.exit("\n".join(invalid))
          PY
        continue-on-error: true  # remove once examples exist (PLAN B1.6)

  profiles:
    # A profile is a conformance contract. JSON Schema can say one is well-formed; it
    # cannot say that a profile which `extends` another may only TIGHTEN it. Without
    # that check aegs-2 could quietly relax something aegs-1 requires, and a higher
    # level would be weaker than a lower one while both still validated.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "jsonschema>=4.20"
      - name: Profiles valid, and extends only tightens
        run: python tools/check_profiles.py

  normative:
    # A MUST with no test is a wish. This job fails when a normative statement
    # has no cross-reference to a conformance case or a vector. (PLAN B2.19)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Every MUST is cross-referenced
        run: python tools/lint_normative.py
        continue-on-error: true  # remove once spec/ and the linter exist (PLAN B2)

  vectors:
    # Vector coverage report, so "we added a MUST but no vector" is visible
    # rather than discovered later. (PLAN B4.10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install jsonschema
      - name: Vectors validate against their own schema
        run: python tools/check_vectors.py
        continue-on-error: true  # remove once vectors/ exists (PLAN B4)

  conformance:
    # The runner must import no implementation. The stub adapter must keep
    # scoring badly — its whole job is proving the suite bites.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest jsonschema
      - name: Suite self-tests
        run: pytest conformance/tests -q
        continue-on-error: true  # remove once conformance/ is ported (PLAN B5.1)
      - name: Stub adapter still fails most cases
        run: python conformance/run.py --adapter stub
        continue-on-error: true
